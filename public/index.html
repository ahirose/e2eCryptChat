<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <meta name="theme-color" content="#00ffff">
  <meta name="description" content="End-to-End encrypted chat with Double Ratchet algorithm">
  <title>すごい安全なチャット</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header>
      <button class="menu-toggle" id="menu-toggle" aria-label="メニュー">☰</button>
      <h1>🔒 すごい安全なチャット</h1>
      <div class="status">
        <span id="status" class="status-disconnected">接続していません</span>
        <span id="user-id" class="user-id"></span>
      </div>
    </header>

    <div class="sidebar-overlay" id="sidebar-overlay"></div>
    <div class="main-content">
      <aside class="sidebar">
        <h3>オンラインユーザー</h3>
        <div id="peers-list" class="peers-list">
          <p class="no-peers">他のユーザーがいません</p>
        </div>
        <div class="encryption-info">
          <h4>🔐 暗号化情報</h4>
          <p>全てのメッセージはEnd-to-End暗号化されています</p>
          <ul>
            <li>Double Ratchet (Signal)</li>
            <li>ECDH P-256鍵交換</li>
            <li>AES-GCM-256暗号化</li>
            <li>HKDF鍵導出</li>
          </ul>
        </div>
      </aside>

      <main class="chat-container">
        <div class="current-peer">
          <span id="current-peer-name">チャット相手を選択してください</span>
        </div>

        <!-- Fingerprint Display -->
        <div id="fingerprint-display" class="fingerprint-display" style="display: none;"></div>

        <div id="messages" class="messages"></div>
        <form id="message-form" class="message-form" disabled>
          <input
            type="text"
            id="message-input"
            placeholder="チャット相手を選択してメッセージを入力..."
            disabled
          >
          <button type="submit" id="send-button" disabled>送信</button>
        </form>
      </main>
    </div>
  </div>

  <!-- Notification Container -->
  <div id="notification-container" class="notification-container"></div>

  <script src="crypto.js"
          integrity="sha384-xuivYTf2mJQzXH4OyAgm3/cN3HMXyJeZsxWTKuLZVKpAbAXsRiDhMiW2zGgBUOs5"
          crossorigin="anonymous"></script>
  <script src="client.js"
          integrity="sha384-t1TehMlXRFFwWMZRdaiKixFUQBi/opE57LaPCcsCacFmkzjjXpNJ1ftvFJaB4IhL"
          crossorigin="anonymous"></script>
</body>
</html>
